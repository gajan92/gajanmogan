<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Ring and Halo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f2f0; --fg:#1a1a1a; --muted:#5f5f5f; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121212; --fg:#eee; --muted:#a0a0a0; --card:#1c1c1c; } }
  :root[data-theme="dark"] { --bg:#121212; --fg:#eee; --muted:#a0a0a0; --card:#1c1c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; padding:24px 16px 48px; }
  h1 { font-weight:600; font-size:22px; margin:0 0 6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:22px; max-width:900px; margin-top:20px; }
  .card { background:var(--card); border-radius:18px; padding:24px; display:flex; flex-direction:column; align-items:center; }
  .watch { width:100%; max-width:400px; aspect-ratio:1; border-radius:50%; background:#000; box-shadow:0 0 0 10px #262626, 0 0 0 12px #4a4a4a, 0 10px 34px rgba(0,0,0,.4); overflow:hidden; }
  .watch svg { width:100%; height:100%; display:block; }
  body.export { padding:0; background:#000; }
  body.export #sprites { display:flex; gap:4px; flex-wrap:wrap; }
  body.export #face, body.export [data-sprite] { display:block; }
  .label { margin-top:24px; font-weight:700; font-size:18px; align-self:flex-start; }
</style>
</head>
<body>
<h1>Day Ring and Halo — reference states</h1>
<div class="grid" id="grid"></div>

<script>
const C = 195;
const COL = { hr:"#FF4D4D", steps:"#3DD6F5", fast:"#FF9F1C", batt:"#4CD964", wx:"#FFD60A", kcal:"#FF5FA2", sun:"#FFC247" };
let uid = 0;

// ---------- geometry ----------
function ptC(cx,cy,r,f){ const a=f*2*Math.PI-Math.PI/2; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
const pt=(r,f)=>ptC(C,C,r,f);
function arcC(cx,cy,r,f0,f1){ const [x0,y0]=ptC(cx,cy,r,f0),[x1,y1]=ptC(cx,cy,r,f1); const L=(f1-f0)>.5?1:0; return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${L} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
const arc=(r,f0,f1)=>arcC(C,C,r,f0,f1);
function arcCCW(r,f0,f1){ const [x0,y0]=pt(r,f0),[x1,y1]=pt(r,f1); const L=(f0-f1)>.5?1:0; return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${L} 0 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
function hex(c){ const n=parseInt(c.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function lerp(a,b,t){ const A=hex(a),B=hex(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")})`; }
function multi(cols,t){ if(cols.length===1) return cols[0]; const s=Math.max(0,Math.min(1,t))*(cols.length-1); const i=Math.min(Math.floor(s),cols.length-2); return lerp(cols[i],cols[i+1],s-i); }
function gradArcC(cx,cy,r,f0,f1,cols,w,cap=true){
  const n=Math.max(10,Math.ceil(Math.abs(f1-f0)*260)); let s="";
  for(let i=0;i<n;i++){ const a=f0+(f1-f0)*i/n, b=f0+(f1-f0)*(i+1)/n+(i<n-1?.0015:0);
    s+=`<path d="${arcC(cx,cy,r,a,b)}" stroke="${multi(cols,(i+.5)/n)}" stroke-width="${w}" fill="none"/>`; }
  if(cap){ const [x0,y0]=ptC(cx,cy,r,f0),[x1,y1]=ptC(cx,cy,r,f1);
    s+=`<circle cx="${x0}" cy="${y0}" r="${w/2}" fill="${multi(cols,0)}"/><circle cx="${x1}" cy="${y1}" r="${w/2}" fill="${multi(cols,1)}"/>`; }
  return s;
}
const gradArc=(r,f0,f1,cols,w,cap)=>gradArcC(C,C,r,f0,f1,cols,w,cap);
function track(r,f0,f1,col,w){ return `<path d="${arc(r,f0,f1)}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`; }
function ticks(r0,r1,f0,f1,n,col,w=1,majorEvery=0,majorCol="#aaa",majorW=1.6){
  let s=""; for(let i=0;i<=n;i++){ const f=f0+(f1-f0)*i/n; const M=majorEvery&&i%majorEvery===0; const [x0,y0]=pt(r0,f),[x1,y1]=pt(M?r1+2:r1,f);
    s+=`<line x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}" stroke="${M?majorCol:col}" stroke-width="${M?majorW:w}"/>`; } return s;
}

// ---------- text helpers (positions are finalised by layout() after fonts load) ----------
// vertically centred text: ink is centred on cy; horizontally centred on cx
function vt(cx,cy,s,o={}){
  const fit=o.fit?` data-fit='${JSON.stringify(o.fit)}'`+(o.fitDial?` data-fitdial="${o.fitDial.join(",")}"`:"")+(o.fitCaps?` data-fitcaps="${o.fitCaps.join(",")}"`:""):"";
  return `<text class="vc"${fit} data-cx="${cx}" data-cy="${cy}" data-a="${o.a||'middle'}"${o.id?` data-audit="${o.id}"`:''}${o.center?' data-center="1"':''}${o.deg?' data-deg="1"':''} x="${cx}" y="${cy}" text-anchor="${o.deg?'start':(o.a||'middle')}" fill="${o.f||'#fff'}" font-family="${o.ff||'Inter'}" font-weight="${o.w||400}" font-size="${o.s||14}" letter-spacing="${o.ls||0}">${s}</text>`;
}
let pid=0;
function ct(r,f,s,o={}){
  const id="cp"+(pid++), span=o.span||.2, bottom=f>.25&&f<.75;
  const d=bottom?arcCCW(r,f+span,f-span):arc(r,f-span,f+span);
  return `<defs><path id="${id}" d="${d}"/></defs><text fill="${o.f||'#fff'}" font-family="Inter" font-weight="${o.w||600}" font-size="${o.s||10}" letter-spacing="${o.ls??1.2}"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${s}</textPath></text>`;
}
function ctAt(r,f,s,anchor,offPx,o={}){
  const id="cp"+(pid++), span=o.span||.2, bottom=f>.25&&f<.75;
  const d=bottom?arcCCW(r,f+span,f-span):arc(r,f-span,f+span);
  const len=r*2*Math.PI*2*span, ls=o.ls??1.2;
  const off=len/2+offPx+(anchor==="end"?ls:0); // end-anchored text carries trailing letter-spacing
  return `<defs><path id="${id}" d="${d}"/></defs><text fill="${o.f||'#fff'}" font-family="Inter" font-weight="${o.w||600}" font-size="${o.s||10}" letter-spacing="${ls}"><textPath href="#${id}" startOffset="${off.toFixed(2)}" text-anchor="${anchor}">${s}</textPath></text>`;
}
// icons, drawn with their own centre at (cx,cy)
function heart(cx,cy,c,sz=12){ const s=sz/12; return `<path transform="translate(${cx-6*s} ${cy-5.5*s}) scale(${s})" d="M6 11 C2 8 0 6 0 3.5 C0 1.5 1.5 0 3.3 0 C4.5 0 5.4 .7 6 1.6 C6.6 .7 7.5 0 8.7 0 C10.5 0 12 1.5 12 3.5 C12 6 10 8 6 11Z" fill="${c}"/>`; }
function sunsetIcon(cx,cy,c){ return `<g transform="translate(${cx-7} ${cy-6})" stroke="${c}" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M2 9 A5 5 0 0 1 12 9"/><line x1="0" y1="11.5" x2="14" y2="11.5"/><path d="M7 0 V4 M5 2.5 L7 4.5 L9 2.5"/></g>`; }
function sunIcon(cx,cy,c,sc=1){ let g=`<g transform="translate(${cx} ${cy}) scale(${sc})" stroke="${c}" stroke-width="1.5" stroke-linecap="round" fill="none"><circle cx="0" cy="0" r="3"/>`; for(let i=0;i<8;i++){const a=i*Math.PI/4; g+=`<line x1="${(5*Math.cos(a)).toFixed(2)}" y1="${(5*Math.sin(a)).toFixed(2)}" x2="${(6.8*Math.cos(a)).toFixed(2)}" y2="${(6.8*Math.sin(a)).toFixed(2)}"/>`;} return g+`</g>`; }
// a horizontal row of items, centred as a whole on cx (or right/left aligned to x)
function row(id, mode, x, inner){ return `<g class="row" data-mode="${mode}" data-x="${x}" data-audit="${id}">${inner}</g>`; }
const GLOW = id=>`<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

// time: Orbitron two-tone, scaled to width, centred between two neighbours
// ---------- states (single source of truth; exported to states.json) ----------
const HR_HIST=[72,70,68,66,65,63,62,64,70,84,93,88,77,71,68,66,64,63,66,68,65,62,63,64];
const REF_STATE={ name:"reference", hour:10, minute:9, is24:true, dayName:"WED", dayNum:18, monthName:"NOV",
  hr:64, hrHistory:HR_HIST, steps:6412, stepGoal:10000, kcalTotal:2180, kcalActive:640, distanceCm:480000, statute:false,
  weightG:78400, battery:82, batteryDays:6, tempC:12, hiC:14, loC:6, fahrenheit:false, condition:"clear",
  riseMin:461, setMin:991, eatStart:720, eatEnd:1200 };
const STATES=[
  REF_STATE,
  {...REF_STATE, name:"eating", hour:15, minute:0},
  {...REF_STATE, name:"missing", hr:null, hrHistory:null, tempC:null, hiC:null, loC:null, condition:null,
    riseMin:null, setMin:null, weightG:null, batteryDays:null, kcalActive:null},
  {...REF_STATE, name:"h12single", hour:13, minute:5, is24:false},
  {...REF_STATE, name:"large", steps:99999, kcalTotal:9999, kcalActive:8888, distanceCm:4219000, statute:true,
    weightG:181400, battery:100, batteryDays:30, hr:188, tempC:40, hiC:43, loC:37, fahrenheit:true},
  {...REF_STATE, name:"midnight", hour:0, minute:1, dayName:"THU", dayNum:19, riseMin:462},
];
window.STATES=STATES;

// ---------- format rules (mirrored exactly by common/source/Format.mc, Units.mc, Fasting.mc, Sun.mc) ----------
const pad2=n=>String(n).padStart(2,"0");
const mod=(x,m)=>((x%m)+m)%m;
const F={
  duration(m){ const h=Math.floor(m/60), mm=m%60; return h&&mm?`${h}H ${pad2(mm)}M`:h?`${h}H`:`${mm}M`; },
  thousands(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,","); },
  kilo(n){ if(n<1000) return String(n); const q=Math.floor(n/100), w=Math.floor(q/10), d=q%10; return d?`${w}.${d}K`:`${w}K`; },
  hhmm(m,is24){ const h=Math.floor(m/60), mm=m%60; return is24?`${pad2(h)}:${pad2(mm)}`:`${h%12||12}:${pad2(mm)}`; },
  clock(h,m,is24){ return is24?[pad2(h),pad2(m)]:[String(h%12||12),pad2(m)]; },
  windowLabel(s,e){ return (s%60===0&&e%60===0)?`${pad2(s/60)}–${pad2(e/60)}`:`${F.hhmm(s,true)}–${F.hhmm(e,true)}`; },
  lb(g){ return g==null?"--":(g/453.592).toFixed(1); },
  distance(cm,statute){ const km=cm/100000; return statute?[(km/1.609344).toFixed(1),"MI"]:[km.toFixed(1),"KM"]; },
  temp(c,f){ return c==null?"--":String(Math.round(f?c*9/5+32:c)); },
};
function fasting(now,s,e){
  if(s===e) return null;
  const eatLen=mod(e-s,1440), since=mod(now-s,1440);
  const st= since<eatLen ? {isEating:true, elapsed:since, total:eatLen} : {isEating:false, elapsed:mod(now-e,1440), total:1440-eatLen};
  st.minutesLeft=st.total-st.elapsed; st.progress=st.elapsed/st.total; return st;
}
function sunNext(now,rise,set){
  if(rise==null||set==null) return null;
  return mod(set-now,1440)<=mod(rise-now,1440)?[true,set]:[false,rise];
}
const hrFrac=b=>Math.max(0,Math.min(1,(b-40)/150));
const clamp01=x=>Math.max(0,Math.min(1,x));
function derive(d){
  const now=d.hour*60+d.minute, st=fasting(now,d.eatStart,d.eatEnd), sun=sunNext(now,d.riseMin,d.setMin);
  const night=(d.riseMin!=null&&d.setMin!=null)&&(now>=d.setMin||now<d.riseMin);
  const leftLabel= st? (st.isEating?`FAST IN ${F.duration(st.minutesLeft)}`:`EAT IN ${F.duration(st.minutesLeft)}`) : "EAT IN --";
  const [dist,unit]=F.distance(d.distanceCm,d.statute);
  return {now,st,sun,night,leftLabel,dist,unit,clock:F.clock(d.hour,d.minute,d.is24),
    wxIcon: d.condition==null?null:(d.condition==="clear"&&night?"clear_night":d.condition)};
}

// ---------- layers: S = static (baked into <face>_base.png), D = drawn live on the watch ----------
const PARAMS=new URLSearchParams(location.search);
const LAYER=PARAMS.get("layer")||"full";
const S=x=>x, D=x=>LAYER==="base"?"":x;

// ---------- icons (also exported as sprites) ----------
function cloudPath(dx=0,dy=0){ return `<path transform="translate(${dx} ${dy})" d="M-5.2 3.6 H4.2 A2.9 2.9 0 0 0 4.4 -2.2 A4.2 4.2 0 0 0 -3.6 -1.2 A2.4 2.4 0 0 0 -5.2 3.6 Z"/>`; }
function wxIcon(name,cx,cy,c,sc=1){
  const g=inner=>`<g transform="translate(${cx} ${cy}) scale(${sc})" stroke="${c}" stroke-width="${sc<1?(1.3/sc).toFixed(3):1.5}" stroke-linecap="round" stroke-linejoin="round" fill="none">${inner}</g>`;
  const rays=(r0,r1)=>{ let s=""; for(let i=0;i<8;i++){const a=i*Math.PI/4; s+=`<line x1="${(r0*Math.cos(a)).toFixed(2)}" y1="${(r0*Math.sin(a)).toFixed(2)}" x2="${(r1*Math.cos(a)).toFixed(2)}" y2="${(r1*Math.sin(a)).toFixed(2)}"/>`;} return s; };
  switch(name){
    case "clear": return g(`<circle r="3"/>`+rays(5,6.8));
    case "clear_night": return g(`<path d="M2.2 -6 A6.2 6.2 0 1 0 6.2 2.6 A4.8 4.8 0 0 1 2.2 -6 Z"/>`);
    case "partly": return g(`<g transform="translate(-2.4 -2.6) scale(.62)"><circle r="3"/>${rays(5,6.8)}</g>`+cloudPath(1,1.6));
    case "cloudy": return g(cloudPath(0,0));
    case "rain": return g(cloudPath(0,-2)+`<line x1="-3" y1="4" x2="-3.8" y2="6.2"/><line x1="0.4" y1="4" x2="-0.4" y2="6.2"/><line x1="3.8" y1="4" x2="3" y2="6.2"/>`);
    case "snow": return g(cloudPath(0,-2)+`<circle cx="-3.4" cy="5.2" r=".5"/><circle cx="0" cy="5.6" r=".5"/><circle cx="3.4" cy="5.2" r=".5"/>`);
    case "thunder": return g(cloudPath(0,-2)+`<polyline points="0.6,2.6 -1.4,5.2 1,5.2 -0.6,7.4"/>`);
    case "fog": return g(`<line x1="-6" y1="-2.5" x2="6" y2="-2.5"/><line x1="-6" y1="0.5" x2="6" y2="0.5"/><line x1="-6" y1="3.5" x2="6" y2="3.5"/>`); // half-pixel offsets keep the lines crisp
    case "wind": return g(`<path d="M-6 -2.5 H3 A2 2 0 1 0 1 -4.5"/><path d="M-6 0.5 H5 A2 2 0 1 1 3 2.5"/><path d="M-6 3.5 H0"/>`);
  }
  return "";
}
function sunEventIcon(isSet,cx,cy,c){
  const arrow=isSet?`M7 0 V4 M5 2.5 L7 4.5 L9 2.5`:`M7 4.5 V0.5 M5 2 L7 0 L9 2`;
  return `<g transform="translate(${cx-7} ${cy-6})" stroke="${c}" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M2 9 A5 5 0 0 1 12 9"/><line x1="0" y1="11.5" x2="14" y2="11.5"/><path d="${arrow}"/></g>`;
}
function haloHead(cx,cy,eating,G){
  return `<circle cx="${cx}" cy="${cy}" r="9" fill="${eating?'#FFF8EC':'#FFE6BF'}" filter="url(#${G})"/><circle cx="${cx}" cy="${cy}" r="3.2" fill="${eating?'#D9C9A8':'#FF7A1A'}"/>`;
}

function timeEl(d,width,above,below){
  const [h,m]=derive(d).clock;
  return `<text class="time" data-w="${width}" data-above="${above}" data-below="${below}" data-audit="time" data-center="1" x="${C}" y="${C}" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="60"><tspan fill="#fff">${h}</tspan><tspan fill="#FF9F1C">:${m}</tspan></text>`;
}
// time font size is fixed per face (65 / 59 px, as built for the watch); width only sets the reference
const TIME_SIZE={dayring:65.1, halo:58.72};

// subdial: base (disc, ticks outside the ring, track) is static; the fill is live
function subdialBase(cx,cy,r,f0,f1,trk,w=4,tickCount=36){
  const disc=r+w/2+5;
  let s=`<circle cx="${cx}" cy="${cy}" r="${disc}" fill="#070707" stroke="#1f1f1f" stroke-width="1"/>`;
  const n=Math.round(tickCount*(f1-f0));
  for(let i=0;i<=n;i++){ const f=f0+(f1-f0)*i/n; if(f1-f0===1&&i===n) continue; const M=i%3===0;
    const [x0,y0]=ptC(cx,cy,r+w/2+1.2,f),[x1,y1]=ptC(cx,cy,r+w/2+(M?4:2.8),f);
    s+=`<line x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}" stroke="${M?'#5a5a5a':'#303030'}" stroke-width="${M?1.1:.8}"/>`; }
  if(trk) s+=`<path d="${arcC(cx,cy,r,f0,f1)}" stroke="${trk}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  return s;
}
const subdialFill=(cx,cy,r,f0,f1,frac,cols,w=4)=>frac>0?gradArcC(cx,cy,r,f0,f0+(f1-f0)*Math.min(1,frac),cols,w):"";
const CREAM="#F2E3C6", CREAM_GRAD=["#6e6150","#D9C9A8","#F2E3C6","#FFF8EC"];

// ============ DAY RING ============
const dayFm=m=>mod((m/60-12)/24,1);
function dayRing(d){
  const x=derive(d), G="g"+(uid++);
  const fRise=dayFm(d.riseMin??360), fSet=dayFm(d.setMin??1080), fNow=dayFm(x.now);
  const fSet2=fRise+mod(fSet-fRise,1);
  let s=`<defs>${GLOW(G)}</defs>`;
  // 24h band (changes daily with sunrise/sunset) — live
  s+=D(gradArc(180,fSet2-1,fRise,["#3448b0","#141f63","#0b1240","#141f63","#3448b0"],16,false));
  s+=D(gradArc(180,fRise,fSet2,["#5a4210","#b8862a","#e0b04a","#b8862a","#5a4210"],16,false));
  for(let h=0;h<24;h++){ if(h%3===0) continue; const f=dayFm(h*60); const [x0,y0]=pt(172,f),[x1,y1]=pt(188,f); s+=D(`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#000" stroke-width="1.4"/>`); }
  for(let h=0;h<24;h+=3){ const f=dayFm(h*60), bottom=f>.25&&f<.75; s+=D(ct(bottom?183.3:176.7,f,pad2(h),{s:9,w:800,f:"rgba(255,255,255,.9)",ls:0,span:.06})); }
  if(d.riseMin!=null&&d.setMin!=null) for(const f of [fRise,fSet]){ const [px,py]=pt(180,f); s+=D(`<circle cx="${px}" cy="${py}" r="4.2" fill="${COL.sun}" stroke="#000" stroke-width="1.6"/>`); }
  // fasting track (depends on settings) — live
  const fE=dayFm(d.eatEnd), fS=dayFm(d.eatStart);
  const fFastEnd=fE+mod(fS-fE,1), fEatEnd=fS+mod(fE-fS,1);
  s+=D(track(165,fE,fFastEnd,"#3a2307",5));
  s+=D(`<path d="${arc(165,fS,fEatEnd)}" stroke="#d8d8d8" stroke-width="2.6" stroke-dasharray="0.1 6" stroke-linecap="round" fill="none"/>`);
  if(x.st&&!x.st.isEating) s+=D(`<g filter="url(#${G})">${gradArc(165,fE,fE+(fFastEnd-fE)*x.st.progress,["#b23a06","#FF7A1A","#FFB347"],5)}</g>`);
  if(x.st&&x.st.isEating&&x.st.progress>0) s+=D(`<path d="${arc(165,fS,fS+(fEatEnd-fS)*x.st.progress)}" stroke="${CREAM}" stroke-width="5" stroke-linecap="round" fill="none"/>`);
  s+=D(ct(153,(fS+fEatEnd)/2%1,`EAT ${F.windowLabel(d.eatStart,d.eatEnd)}`,{s:7.5,f:"#bdbdbd",span:.08}));
  const pct=x.st?Math.round(x.st.progress*100)+"%":"--";
  s+=D(ct(158.5,.6,`${x.st&&x.st.isEating?"EATING":"FASTING"} ${pct}`,{s:7.5,f:x.st&&x.st.isEating?CREAM:COL.fast,span:.1}));
  { const [x0,y0]=pt(158,fNow),[x1,y1]=pt(191,fNow); s+=D(`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#fff" stroke-width="2.4" stroke-linecap="round" filter="url(#${G})"/>`);
    const [hx,hy]=pt(165,fNow); s+=D(`<circle cx="${hx}" cy="${hy}" r="5" fill="#fff" stroke="#000" stroke-width="2"/>`); }
  // inner gauges: scales, tracks and the HR zone arc are static; fills, markers and labels live
  s+=S(ticks(141,144,-.07,.07,10,"#383838",1,5,"#777"));
  s+=S(track(134,-.07,.07,"#11331b",7))+D(gradArc(134,-.07,-.07+.14*d.battery/100,["#1d7d36","#4CD964"],7));

// ---------- layout pass: measure real glyph ink and position precisely ----------
const cv=document.createElement("canvas").getContext("2d");
function ink(el, str){ // ascent/descent of the actual glyphs at the element's font
  const cs=getComputedStyle(el); cv.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const m=cv.measureText(str); return {asc:m.actualBoundingBoxAscent, desc:m.actualBoundingBoxDescent};
}
function layout(svg){
  // 1. vertically centred texts
  for(const el of svg.querySelectorAll("text.vc")){
    const cy=+el.dataset.cy, cx=+el.dataset.cx, {asc,desc}=ink(el, el.textContent);
    el.setAttribute("y",(cy+(asc-desc)/2).toFixed(2));
    if(el.dataset.deg){ // centre the digits; let the degree sign hang to the right
      const n=el.textContent.length, hasDeg=el.textContent.endsWith("°"); const digits=hasDeg?el.getSubStringLength(0,n-1):el.getComputedTextLength();
      const a=el.dataset.a; el.setAttribute("x",(a==="start"?cx:cx-digits/2).toFixed(2));
    }
  }
  // 1a. shrink-to-fit inside a subdial: first option whose ink corners stay inside (free radius - 1)
  for(const el of svg.querySelectorAll("text[data-fit]")){
    const cy=+el.dataset.cy, cx=+el.dataset.cx;
    for(const opt of JSON.parse(el.dataset.fit)){
      el.setAttribute("font-size",opt.s); el.setAttribute("font-weight",opt.w); el.setAttribute("letter-spacing",opt.ls);
      if(opt.t!==undefined) el.textContent=opt.t;
      const {asc,desc}=ink(el,el.textContent); el.setAttribute("y",(cy+(asc-desc)/2).toFixed(2));
      if(el.dataset.deg){ const n=el.textContent.length, hasDeg=el.textContent.endsWith("°"); const digits=hasDeg?el.getSubStringLength(0,n-1):el.getComputedTextLength(); el.setAttribute("x",(cx-digits/2).toFixed(2)); }
      if(fitsOK(el)) break;
    }
  }
  // 1b. 'after' groups sit a fixed gap after everything before them in their row
  for(const g of svg.querySelectorAll("g.after")){
    let R=-1e9; for(let p=g.previousElementSibling;p;p=p.previousElementSibling){ const bb=p.getBBox(); const t=p.transform&&p.transform.baseVal.consolidate(); R=Math.max(R,bb.x+bb.width+(t?t.matrix.e:0)); }
    g.setAttribute("transform",`translate(${(R+ +g.dataset.gap).toFixed(2)} 0)`);
  }
  // 2. rows: place group, then align horizontally using its real bbox
  for(const g of svg.querySelectorAll("g.row")){
    const x=+g.dataset.x, y=+g.dataset.y; g.setAttribute("transform",`translate(0 ${y})`);
    const bb=g.getBBox(); let tx;
    if(g.dataset.mode==="center") tx=x-(bb.x+bb.width/2);
    else if(g.dataset.mode==="right") tx=x-(bb.x+bb.width);
    else tx=x-bb.x;
    g.setAttribute("transform",`translate(${tx.toFixed(2)} ${y})`);
  }
  // 2b. centre composite groups as a whole
  for(const g of svg.querySelectorAll("g.cgroup")){ const bb=g.getBBox(); g.setAttribute("transform",`translate(${(C-(bb.x+bb.width/2)).toFixed(2)} 0)`); }
  // 3. time: scale to target width, then centre its ink exactly between its neighbours
  for(const el of svg.querySelectorAll("text.time")){
    el.setAttribute("font-size",TIME_SIZE[svg.dataset.face]);
    const box=id=>{ const n=svg.querySelector(`[data-audit="${id}"]`); const b=n.getBBox(); const m=n.getCTM? n.transform.baseVal.consolidate():null; const ty=m?m.matrix.f:0; return {top:b.y+ty, bottom:b.y+b.height+ty}; };
    const above=svg.querySelector(`[data-audit="${el.dataset.above}"]`), below=svg.querySelector(`[data-audit="${el.dataset.below}"]`);
    const inkBox=n=>inkBounds(n);
    const a=inkBox(above), b=inkBox(below);
    const mid=(a.bottom+b.top)/2; const {asc,desc}=ink(el,el.textContent);
    el.setAttribute("y",(mid+(asc-desc)/2).toFixed(2));
  }
}
// fit test shared by layout() and audit(): inside the dial's free radius, clear of arc end caps
function fitsOK(el){
  const b=inkBounds(el), corners=[[b.left,b.top],[b.right,b.top],[b.left,b.bottom],[b.right,b.bottom]];
  if(el.dataset.fitdial){ const [dx,dy,rin]=el.dataset.fitdial.split(",").map(Number); if(!corners.every(([x,y])=>Math.hypot(x-dx,y-dy)<=rin-1)) return false; }
  if(el.dataset.fitcaps){ const c=el.dataset.fitcaps.split(",").map(Number);
    for(const [px,py] of [[c[0],c[1]],[c[2],c[3]]]){ const nx=Math.max(b.left,Math.min(px,b.right)), ny=Math.max(b.top,Math.min(py,b.bottom)); if(Math.hypot(nx-px,ny-py)<c[4]+1) return false; } }
  return true;
}
// ink bounds of an audited node (text: real glyph ink; groups: union of children)
function inkBounds(n){
  if(n.tagName==="text"){
    const {asc,desc}=ink(n,n.textContent); const y=+n.getAttribute("y"); const bb=n.getBBox();
    const t=n.parentNode.transform&&n.parentNode.transform.baseVal.consolidate(); const ox=t?t.matrix.e:0, oy=t?t.matrix.f:0;
    return {left:bb.x+ox, right:bb.x+bb.width+ox, top:y-asc+oy, bottom:y+desc+oy};
  }
  const t=n.transform&&n.transform.baseVal.consolidate(); const ox=t?t.matrix.e:0, oy=t?t.matrix.f:0;
  let L=1e9,R=-1e9,T=1e9,B=-1e9;
  for(const ch of n.children){
    let b; if(ch.tagName==="text"){ const {asc,desc}=ink(ch,ch.textContent); const y=+ch.getAttribute("y"); const bb=ch.getBBox(); b={left:bb.x,right:bb.x+bb.width,top:y-asc,bottom:y+desc}; }
    else if(ch.tagName==="g" && ch.querySelector("text")){ b=inkBounds(ch); }
    else { const bb=ch.getBBox(); b={left:bb.x,right:bb.x+bb.width,top:bb.y,bottom:bb.y+bb.height}; const tt=ch.transform&&ch.transform.baseVal.consolidate(); if(tt){ b.left=tt.matrix.a*bb.x+tt.matrix.e; b.right=tt.matrix.a*(bb.x+bb.width)+tt.matrix.e; b.top=tt.matrix.d*bb.y+tt.matrix.f; b.bottom=tt.matrix.d*(bb.y+bb.height)+tt.matrix.f; } }
    L=Math.min(L,b.left);R=Math.max(R,b.right);T=Math.min(T,b.top);B=Math.max(B,b.bottom);
  }
  return {left:L+ox,right:R+ox,top:T+oy,bottom:B+oy};
}
// ---------- audit: centring, overlaps, edge clearance ----------
function audit(svg){
  const dialItems=new Set([...svg.querySelectorAll("[data-dial]")].flatMap(d=>d.dataset.items.split(" ")).concat(["wx-lo","wx-hi"]));
  const out=[]; const items=[...svg.querySelectorAll("[data-audit]")].map(n=>({id:n.dataset.audit,n,b:inkBounds(n),center:!!n.dataset.center}));
  for(const it of items){ if(it.center){ const off=((it.b.left+it.b.right)/2-C); if(Math.abs(off)>0.75) out.push(`OFF-CENTRE ${it.id}: ${off.toFixed(2)}px`); } }
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){ const a=items[i].b,b=items[j].b;
    const ox=Math.min(a.right,b.right)-Math.max(a.left,b.left), oy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
    if(ox>-2&&oy>-2) out.push(`TOO CLOSE ${items[i].id} / ${items[j].id}: overlap x ${ox.toFixed(1)}, y ${oy.toFixed(1)}`); }
  for(const it of items){ for(const [x,y] of [[it.b.left,it.b.top],[it.b.right,it.b.top],[it.b.left,it.b.bottom],[it.b.right,it.b.bottom]]){ const r=Math.hypot(x-C,y-C); if(r>(svg.dataset.face==="halo"?121:118) && !dialItems.has(it.id)) { out.push(`NEAR RING ${it.id}: corner at r=${r.toFixed(1)}`); break; } } }
  for(const el of svg.querySelectorAll("text[data-fit]")) if(!fitsOK(el)) out.push(`DOES NOT FIT ${el.dataset.audit||el.textContent}`);
  for(const d of svg.querySelectorAll("[data-dial]")){ const [cx,cy,rin]=d.dataset.dial.split(",").map(Number);
    for(const id of d.dataset.items.split(" ")){ const it=items.find(i=>i.id===id); if(!it) continue; const b=it.b;
      for(const [x,y] of [[b.left,b.top],[b.right,b.top],[b.left,b.bottom],[b.right,b.bottom]]){ const r=Math.hypot(x-cx,y-cy); if(r>rin-1){ out.push(`TOUCHES DIAL ${id}: corner r=${r.toFixed(1)} vs free radius ${rin}`); break; } } } }
  return {issues:out, boxes:Object.fromEntries(items.map(i=>[i.id,{...Object.fromEntries(Object.entries(i.b).map(([k,v])=>[k,+v.toFixed(1)])), text:i.n.textContent.replace(/\s+/g," ").trim(), center:i.center}]))};
}
window.AUDIT=null;
Promise.all(["900 20px Orbitron","400 20px Inter","500 20px Inter","600 20px Inter","700 20px Inter","800 20px Inter"].map(f=>document.fonts.load(f))).then(()=>{
  const res={};
  if(LAYER!=="base") for(const svg of document.querySelectorAll("svg[data-face]")){ layout(svg); res[`${svg.dataset.face}-${svg.dataset.state}`]=audit(svg); }
  const widths={}; for(const t of document.querySelectorAll("text")) if(t.querySelector("textPath")) widths[t.textContent]=+t.getComputedTextLength().toFixed(2);
  window.TEXT_WIDTHS=widths;
  window.AUDIT=res;
});
</script>
