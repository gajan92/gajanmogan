name: process

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  process:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate URL format
        run: |
          echo "${{ github.event.issue.title }}" | \
          grep -qE '^https?://(www\.)?(youtube\.com/watch|youtu\.be/)' || \
          { echo "Issue title is not a YouTube URL — skipping."; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_COOKIE_HEADER: ${{ secrets.YT_COOKIE_HEADER }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > /tmp/yt_cookies.txt
            chmod 600 /tmp/yt_cookies.txt
          elif [ -n "$YT_COOKIE_HEADER" ]; then
            python3 -c "
import os
header = os.environ['YT_COOKIE_HEADER']
lines = ['# Netscape HTTP Cookie File']
for pair in header.split(';'):
    pair = pair.strip()
    if '=' in pair:
        name, _, value = pair.partition('=')
        name = name.strip()
        secure = 'TRUE' if name.startswith('__Secure-') or name.startswith('__Host-') else 'FALSE'
        lines.append(f'.youtube.com\tTRUE\t/\t{secure}\t2147483647\t{name}\t{value}')
print('\n'.join(lines))
" > /tmp/yt_cookies.txt
            chmod 600 /tmp/yt_cookies.txt
          fi

      - name: Process URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
          YT_COOKIES_FILE: /tmp/yt_cookies.txt
          YT_COOKIE_HEADER: ${{ secrets.YT_COOKIE_HEADER }}
        run: |
          python scripts/process_url.py \
            --url "${{ github.event.issue.title }}" \
            --issue-number "${{ github.event.issue.number }}" \
            --repo "$REPO"

      - name: Commit feed and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/ data/episodes.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add episode (issue #${{ github.event.issue.number }})"
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break
            sleep $((i * 2))
          done

  purge:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run purge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
        run: python scripts/purge.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/ data/episodes.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Purge expired episodes"
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break
            sleep $((i * 2))
          done
