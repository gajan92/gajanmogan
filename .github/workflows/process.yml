name: process

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: feed-update
  cancel-in-progress: false

env:
  FEED_TITLE: "Gajan's Listening Queue"

jobs:
  process:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate URL format
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "$ISSUE_TITLE" | \
          grep -qE '^https?://(www\.)?(youtube\.com/watch|youtu\.be/)' || \
          { echo "Issue title is not a YouTube URL — skipping."; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_COOKIE_HEADER: ${{ secrets.YT_COOKIE_HEADER }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > /tmp/yt_cookies.txt
            chmod 600 /tmp/yt_cookies.txt
            echo "Cookie file (YT_COOKIES): $(wc -l < /tmp/yt_cookies.txt) lines"
          elif [ -n "$YT_COOKIE_HEADER" ]; then
            python3 scripts/write_cookies.py /tmp/yt_cookies.txt
            chmod 600 /tmp/yt_cookies.txt
            echo "Cookie file (YT_COOKIE_HEADER): $(wc -l < /tmp/yt_cookies.txt) lines"
          else
            echo "No cookie secret set."
          fi

      - name: Process URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
          YT_COOKIES_FILE: /tmp/yt_cookies.txt
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python scripts/process_url.py \
            --url "$ISSUE_TITLE" \
            --issue-number "$ISSUE_NUMBER" \
            --repo "$REPO"

      - name: Commit feed and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/ data/episodes.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add episode (issue #${{ github.event.issue.number }})"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin master && git push && break
            sleep $((i * 3))
          done || { echo "Push failed after 6 retries"; exit 1; }

      - name: Close issue on success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python scripts/close_issue.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo "$REPO"

  purge:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run purge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
        run: python scripts/purge.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/ data/episodes.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Purge expired episodes"
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break
            sleep $((i * 2))
          done || { echo "Push failed after 3 retries"; exit 1; }
